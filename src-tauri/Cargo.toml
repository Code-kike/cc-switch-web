[package]
name = "cc-switch"
version = "3.16.2"
description = "All-in-One Assistant for Claude Code, Codex & Gemini CLI"
authors = ["Jason Young"]
license = "MIT"
repository = "https://github.com/farion1231/cc-switch"
edition = "2021"
rust-version = "1.85.0"
default-run = "cc-switch"
autobins = false
autoexamples = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cc_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest = false

[features]
default = ["desktop"]
desktop = [
    "tauri",
    "tauri-build",
    "tauri-plugin-log",
    "tauri-plugin-opener",
    "tauri-plugin-process",
    "tauri-plugin-updater",
    "tauri-plugin-dialog",
    "tauri-plugin-store",
    "tauri-plugin-deep-link",
    "tauri-plugin-single-instance",
    "webkit2gtk",
]
web-server = [
    "env_logger",
    "mime_guess",
    "rand",
    "fs2",
    "nix",
]
test-hooks = []
# Build-only feature for the `gen-command-manifest` AST tool (pulls syn/walkdir).
manifest = ["dep:syn", "dep:walkdir", "dep:proc-macro2"]

[[bin]]
name = "cc-switch"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "gen-command-manifest"
path = "src/bin/gen-command-manifest.rs"
required-features = ["manifest"]

[[example]]
name = "server"
path = "examples/server.rs"
required-features = ["web-server"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [], optional = true }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.8.2", features = ["tray-icon", "protocol-asset", "image-png"], optional = true }
tauri-plugin-log = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-store = { version = "2", optional = true }
tauri-plugin-deep-link = { version = "2", optional = true }
dirs = "5.0"
toml = "0.8"
toml_edit = "0.22"
reqwest = { version = "0.12", features = ["rustls-tls", "json", "stream", "socks"] }
arboard = "3.6"
flate2 = "1"
brotli = "7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "signal"] }
futures = "0.3"
async-stream = "0.3"
bytes = "1.5"
axum = { version = "0.7", features = ["macros", "json", "tokio", "multipart"] }
tower = { version = "0.4", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.5", features = ["cors", "auth", "validate-request", "fs", "trace", "request-id", "sensitive-headers", "compression-br", "compression-gzip"] }
hyper = { version = "1.0", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "client-legacy"] }
hyper-rustls = { version = "0.27", features = ["http1", "tls12", "ring", "webpki-tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
httparse = "1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
rustls-native-certs = "0.8"
regex = "1.10"
rquickjs = { version = "0.8", features = ["array-buffer", "classes"] }
thiserror = "2.0"
anyhow = "1.0"
zip = "2.2"
# serde_yaml (dtolnay) is archived/unmaintained (0.9.34+deprecated).
# serde_yaml_ng is the maintained drop-in fork: identical API and the SAME
# unsafe-libyaml parser/emitter backend, so YAML behavior is unchanged — the
# swap only replaces the deprecated wrapper. Package-renamed so all
# `serde_yaml::` paths keep working with zero code changes. Used by
# hermes_config.rs, mcp/hermes.rs, services/skill.rs. (M34)
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
tempfile = "3"
url = "2.5"
auto-launch = "0.5"
once_cell = "1.21.3"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled", "backup", "hooks"] }
indexmap = { version = "2", features = ["serde"] }
rust_decimal = "1.33"
uuid = { version = "1.11", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
json5 = "0.4"
json-five = "0.3.1"

# Web-server feature dependencies (Layer 1 / Task 1)
env_logger = { version = "0.11", optional = true }
mime_guess = { version = "2", optional = true }
rand = { version = "0.8", optional = true }
fs2 = { version = "0.4", optional = true }

# Command manifest binary dependencies (Task 0 generates AST manifest) —
# gated behind the `manifest` feature so default + web builds skip them.
syn = { version = "2", features = ["full", "extra-traits", "parsing", "visit"], optional = true }
walkdir = { version = "2", optional = true }
proc-macro2 = { version = "1", optional = true }

# Linux-only filesystem detection (mount type check) — gated by web-server
[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["fs"], optional = true }
webkit2gtk = { version = "2.0.1", features = ["v2_16"], optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSColor"] }

# Optimize release binary size to help reduce AppImage footprint
[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
# 使用 unwind 以便 panic hook 能捕获 backtrace（abort 会直接终止无法捕获）
panic = "unwind"
strip = "symbols"

[dev-dependencies]
serial_test = "3"
tempfile = "3"
