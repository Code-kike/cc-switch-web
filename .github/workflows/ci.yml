name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Unit tests
        run: pnpm test:unit

      # Web/desktop route-parity gate: every supported command in
      # web-commands.ts must resolve to a real Axum route (H4). Node-only;
      # reuses the deps installed above.
      - name: Web route parity gate
        run: pnpm check:web-routes

      # Locale key-parity gate (L9): every i18n key must exist in all locale
      # files (en/ja/zh). Node-only; reuses the deps installed above.
      - name: Locale key parity gate
        run: pnpm check:locales

  backend:
    name: Backend Checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Honor rust-toolchain.toml as the single source of truth so CI uses the
      # same channel as local dev (M16). Avoids the previous @stable drift.
      - name: Resolve Rust toolchain from rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          channel="$(grep -oP '^channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"
          echo "Resolved Rust channel: ${channel}"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Create frontend dist placeholder
        run: mkdir -p dist

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --all-targets --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Run tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Web-server example compile check
        run: cargo check --no-default-features --features web-server --example server --locked --manifest-path src-tauri/Cargo.toml

      # commands.manifest.json is a gitignored generated artifact, so it never
      # exists on a fresh checkout. Regenerate it (verifies the `manifest`
      # feature compiles + the AST generator runs without panicking), then
      # --check to assert the generator is deterministic / in sync (M17).
      # `--check` alone would exit 2 ("missing") on a clean checkout.
      - name: Command manifest is current
        run: |
          bash scripts/gen-command-manifest.sh
          bash scripts/gen-command-manifest.sh --check

  web-server:
    name: Web Server Checks
    runs-on: ubuntu-22.04
    env:
      # Match the RUSTFLAGS the smoke/integration harnesses pass to their
      # spawned `cargo run` (`RUSTFLAGS || "-Awarnings"`), so the pre-build step
      # below produces the exact artifact they reuse instead of recompiling.
      RUSTFLAGS: "-Awarnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Honor rust-toolchain.toml (M16), same as the backend job.
      - name: Resolve Rust toolchain from rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          channel="$(grep -oP '^channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"
          echo "Resolved Rust channel: ${channel}"
          echo "channel=${channel}" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      - name: Cache Cargo registry and build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-web-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-web-

      # Build the web frontend bundle the server serves and that the smoke /
      # integration harnesses assert against (M18 prerequisite).
      - name: Build web frontend (dist-web)
        run: pnpm build:web

      # Pre-build the web-server example so the in-test `cargo run` starts
      # immediately (the harnesses spawn it and poll /api/health with a fixed
      # timeout). Doubles as a full compile gate for the web runtime.
      - name: Build web-server example
        run: cargo build --no-default-features --features web-server --example server --locked --manifest-path src-tauri/Cargo.toml

      # Run the web-runtime-specific Rust tests that NO other job covers: the
      # web_api unit tests (routes body-limit + SPA fallback) and the dual-runtime
      # module-list parity guard. They live in the `--example server` target and
      # are skipped by the desktop `cargo test` (lib.rs is `#![cfg(feature =
      # "desktop")]`, so web_api never compiles there). Scoped via filters on
      # purpose: the example binary ALSO compiles every other src module's
      # #[cfg(test)] tests, but those are already run by the desktop job and only
      # collide under the example binary's parallelism — re-running them here adds
      # flakiness, not coverage. (item 13)
      - name: Web server Rust tests
        run: |
          cargo test --no-default-features --features web-server --example server --locked --manifest-path src-tauri/Cargo.toml -- web_api:: dual_runtime_parity::

      # smoke + integration are HARD gates (the B7c fixes landed: smoke L31
      # contract aligned to 200 null; integration SSRF-allow set in the test
      # harness, suites run sequentially, and the Claude-rename common-config
      # revert bug fixed). Verified locally: smoke exit 0, integration 50/50.
      - name: Web server smoke test
        run: pnpm smoke:web-server

      - name: Web server integration tests
        run: pnpm test:integration
